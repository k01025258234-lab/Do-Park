<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do-Park U-8 수다방</title>
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts (Gaegu & Jua for playful crayon kid-friendly headers) -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gaegu', cursive;
            background-color: #f4f8ed;
            background-image: radial-gradient(#d1e7dd 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            font-size: 1.25rem;
        }
        .title-font {
            font-family: 'Jua', sans-serif;
        }
        /* Crayon / Hand-drawn rough border styles */
        .crayon-border-1 {
            border: 4px solid #15803d;
            border-radius: 25px;
            box-shadow: 4px 6px 0px #166534;
        }
        .crayon-border-yellow {
            border: 4px solid #d97706;
            border-radius: 25px;
            box-shadow: 4px 6px 0px #b45309;
        }
        .crayon-border-input {
            border: 3px solid #84cc16;
            border-radius: 16px;
        }
        .soccer-field-bg {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            box-shadow: 0 10px 25px -5px rgba(21, 128, 61, 0.3);
        }
        .polaroid {
            background: #ffffff;
            padding: 1rem 1rem 2rem 1rem;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1), 3px 3px 0px #15803d;
            transform: rotate(-1deg);
            transition: transform 0.2s;
        }
        .polaroid:nth-child(even) {
            transform: rotate(1deg);
        }
        .polaroid:hover {
            transform: scale(1.02) rotate(0deg);
        }
        .washi-tape {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 26px;
            background: rgba(253, 224, 71, 0.8);
            border: 1px dashed #ca8a04;
        }
        .paper-card {
            background: repeating-linear-gradient(#fffdf5, #fffdf5 27px, #f1f5f9 28px);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- Passcode Lock Screen -->
    <div id="lockScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-emerald-950/90 backdrop-blur-sm p-4">
        <div class="bg-white p-8 rounded-3xl crayon-border-1 max-w-md w-full text-center">
            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl animate-bounce">
                ⚽
            </div>
            <h1 class="title-font text-3xl text-emerald-900 mb-2">Do-Park 수다방</h1>
            <p class="text-gray-600 mb-6 font-bold">두팍친구들 U8 축구 꿈나무 공간!<br>입장 번호(비밀번호)를 입력해주세요.</p>
            
            <div class="space-y-4">
                <div>
                    <input type="password" id="passcodeInput" placeholder="입장 번호 4자리" maxlength="6" 
                        class="w-full px-4 py-3 text-center text-2xl tracking-widest crayon-border-input focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-emerald-50/50" required>
                </div>
                <button type="button" onclick="handleUnlock()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xl rounded-2xl crayon-border-1 transition-all">
                    🚀 입장하기
                </button>
            </div>
            <p id="lockError" class="text-rose-500 text-sm mt-3 font-bold hidden">비밀번호가 틀렸어요! 다시 확인해 주세요.</p>
        </div>
    </div>

    <!-- Main Application (Hidden until unlocked) -->
    <div id="appContainer" class="hidden max-w-5xl mx-auto px-4 py-6">
        
        <!-- Header Banner (Soccer Field Theme & Members Roster) -->
        <header class="soccer-field-bg p-6 sm:p-8 rounded-3xl crayon-border-1 text-white mb-6">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left mb-6">
                <div class="flex items-center gap-3">
                    <span class="text-5xl sm:text-6xl animate-pulse">⚽</span>
                    <div>
                        <h1 class="title-font text-4xl sm:text-5xl text-yellow-300 drop-shadow-md">Do-Park 수다방</h1>
                        <p class="text-lg sm:text-xl text-emerald-100 font-bold">두팍친구들 축구 이야기 & 훈련일지 저장소</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="openNewPostModal()" class="px-5 py-3 bg-yellow-400 hover:bg-yellow-300 text-emerald-950 font-bold text-xl rounded-2xl crayon-border-yellow transition-all flex items-center gap-2 shadow-lg">
                        <i data-lucide="plus-circle" class="w-6 h-6"></i> 새글 쓰기
                    </button>
                    <button type="button" onclick="lockApp()" class="px-3 py-3 bg-emerald-800/80 hover:bg-emerald-700 text-white rounded-2xl font-bold text-sm" title="잠금">
                        🔒
                    </button>
                </div>
            </div>

            <!-- Members Roster on Header -->
            <div class="bg-white/10 backdrop-blur-sm p-4 rounded-2xl border-2 border-white/30">
                <div class="flex items-center justify-center md:justify-start gap-2 mb-2 text-yellow-200 font-bold text-lg">
                    <span>🏃‍♂️</span> <span>두팍친구들 선수 명단</span>
                </div>
                <div class="flex flex-wrap justify-center md:justify-start gap-2 sm:gap-3 text-base sm:text-lg">
                    <span class="px-3 py-1 bg-white/20 rounded-xl border border-white/30">⚡ 노은준(닌자)</span>
                    <span class="px-3 py-1 bg-white/20 rounded-xl border border-white/30">🦍 이서하(킹콩)</span>
                    <span class="px-3 py-1 bg-white/20 rounded-xl border border-white/30">🔥 김찬유(짠유)</span>
                    <span class="px-3 py-1 bg-white/20 rounded-xl border border-white/30">🦁 전성균(고릴라)</span>
                    <span class="px-3 py-1 bg-white/20 rounded-xl border border-white/30">🥔 김하담(포테토)</span>
                    <span class="px-3 py-1 bg-white/20 rounded-xl border border-white/30">⭐ 최현우(윌리엄)</span>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex flex-wrap gap-3 mb-6 bg-white p-3 rounded-3xl crayon-border-1">
            <button type="button" id="tabFree" onclick="switchTab('free')" class="flex-1 px-4 py-3 rounded-2xl font-bold text-lg sm:text-xl transition-all flex items-center justify-center gap-2 bg-emerald-500 text-white shadow-md">
                💬 자유 게시판 (<span id="freePostCount">0</span>)
            </button>
            <button type="button" id="tabPhoto" onclick="switchTab('photo')" class="flex-1 px-4 py-3 rounded-2xl font-bold text-lg sm:text-xl transition-all flex items-center justify-center gap-2 text-amber-900 hover:bg-amber-100">
                📸 사진방 (<span id="photoPostCount">0</span>)
            </button>
            <button type="button" id="tabTraining" onclick="switchTab('training')" class="flex-1 px-4 py-3 rounded-2xl font-bold text-lg sm:text-xl transition-all flex items-center justify-center gap-2 text-amber-900 hover:bg-amber-100">
                📝 훈련 일지 (<span id="trainingPostCount">0</span>)
            </button>
        </div>

        <!-- Search Bar Component -->
        <div class="bg-white p-4 sm:p-5 rounded-3xl crayon-border-1 flex flex-col sm:flex-row gap-3 items-center justify-between mb-6">
            <div class="flex items-center gap-2 w-full">
                <span class="text-2xl">🔍</span>
                <input type="text" id="searchInput" oninput="filterPosts()" placeholder="현재 게시판에서 이야기 검색하기..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
        </div>

        <!-- Dynamic Post List (All categories render here) -->
        <div id="postsList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 파이어베이스 실시간 데이터가 들어옵니다 -->
        </div>
    </div>

    <!-- New Post Modal Backdrop -->
    <div id="postModal" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white p-6 rounded-3xl crayon-border-1 max-w-lg w-full relative">
            <h2 class="title-font text-2xl text-emerald-900 mb-4 flex items-center gap-2">✏️ 새로운 수다 쓰기</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">카테고리 선택</label>
                    <select id="modalCategory" class="w-full p-2 border-2 border-emerald-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="free">💬 자유 게시판</option>
                        <option value="photo">📸 사진방 (이미지 주소 첨부)</option>
                        <option value="training">📝 훈련 일지</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">글쓴이 (선수 이름)</label>
                    <input type="text" id="modalAuthor" placeholder="예: ⚡ 노은준(닌자)" class="w-full p-2 border-2 border-emerald-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">내용</label>
